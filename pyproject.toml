[project]
name = "antidoom"
version = "0.1.0"
description = "Generate and train FTPO preference data from repetition loops."
readme = "README.md"
authors = [
    { name = "sam-paech-liquid", email = "235002795+sam-paech-liquid@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.19",
    "numpy>=1.26",
    "peft>=0.13",
    "pyyaml>=6.0",
    "requests>=2.31",
    "torch>=2.3",
    "tqdm>=4.66",
    "trl>=0.12",
    "transformers>=4.45",
    "tensorboard",
    "bitsandbytes",
    "vllm",
]

[project.scripts]
antidoom = "antidoom.cli:main"
doomloop = "antidoom.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
