# dittopilot trainer for antidoom: mine FTPO pairs from the input model's own looping generations over the
# input prompt pools, train a LoRA on them, and merge it into a full HF model at {{output_checkpoint_path}}.
# It runs inside the cluster's vLLM ROCm image (vllm/vllm-openai-rocm:v0.33.0-rocm72) with antidoom installed on top;
# trl/peft/datasets are pinned to uv.lock (newer trl rejects antidoom's FTPODataset).

[antidoom-ftpo]
mode = "dpo"
modality = "text"
description = "antidoom FTPO: mine loop-onset preference pairs from the model's own generations over the input prompt pools (JSONL with a `conversations` field, one prompt_pool.jsonl per dataset dir), train a LoRA, merge to a full HF model."
max_input_datasets = "N"
tasks_per_node = 1
command = """
set -euo pipefail
RUN="$(dirname '{{output_checkpoint_path}}')/antidoom-{{model_op_run_id}}"
mkdir -p "$RUN"
for d in {{input_dataset_paths}}; do cat "$d/prompt_pool.jsonl"; done | shuf --random-source=<(yes) > "$RUN/pool.jsonl"
wc -l "$RUN/pool.jsonl"
G="${HIP_VISIBLE_DEVICES:-${ROCR_VISIBLE_DEVICES:-0,1,2,3,4,5,6,7}}"
env -u HIP_VISIBLE_DEVICES -u ROCR_VISIBLE_DEVICES docker run --rm --network=host --ipc=host --shm-size 64G \
  --group-add video --security-opt seccomp=unconfined \
  -e HIP_VISIBLE_DEVICES="$G" -e PYTHONDONTWRITEBYTECODE=1 -e HF_HOME -e HF_TOKEN -e WANDB_API_KEY \
  -v /home/shared_tw:/home/shared_tw -v "$PWD":"$PWD" -w "$PWD" \
  --entrypoint bash vllm/vllm-openai-rocm:v0.33.0-rocm72 -c "
    pip install -q -e . --no-deps && pip install -q trl==1.2.0 peft==0.19.1 datasets==4.8.4 tensorboard &&
    antidoom -c {{config}} -r '$RUN' \
      --model-name '{{checkpoint_path}}' \
      --input-jsonl '$RUN/pool.jsonl' \
      --temp {{temperature}} \
      --target-pairs {{target_pairs}} \
      --max-train-examples {{max_train_examples}} \
      --merged-output-dir '{{output_checkpoint_path}}';
    rc=\\$?; chown -R $(id -u):$(id -g) '$RUN' '{{output_checkpoint_path}}' "$PWD" 2>/dev/null; exit \\$rc"
"""
gpus = 8
cpus = 112
nodes = 1
needs_ray = false
modules = []

[antidoom-ftpo.args.config]
type = "str"
default = "configs/denso_smarthome_jp_amd.yaml"
description = "antidoom config file in this repo."

[antidoom-ftpo.args.temperature]
type = "str"
default = "0.01"
description = "Generation temperature for pair mining."

[antidoom-ftpo.args.target_pairs]
type = "str"
default = "20000"
description = "FTPO pairs to collect before training; mining also stops when the pool runs out."

[antidoom-ftpo.args.max_train_examples]
type = "str"
default = "12000"
description = "Cap on training rows; keep at or below ~70% of the pairs collected."
